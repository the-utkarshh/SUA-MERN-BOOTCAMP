<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Problem 1 Solution</title>
    <style>
        #container{
            width: 100%;
            border: 2px solid black;
            background-color: gray;
        }
        .line1{
            display: grid;
            gap: 10px;
            margin: 5px;
            grid-template-columns: repeat(13,1fr);
        }
        .line1>div{
            height: 30px;
            background-color: black;
            color: white;
            /* align-items: flex-start; */
            text-align: center;
            padding: 5px;
        }
        .line2{
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(12,1fr);
            margin: 5px;
        }
        .line2>div{
            background-color: black;
            color: white;
            height: 30px;
            text-align: center;
            padding: 5px;
            
        }

        .line3{
            display: grid;
            grid-template-columns: repeat(12,1fr);
            gap: 10px;
            margin: 5px;
        }
        .line3>div{
            background-color: black;
            color: white;
            padding: 5px;
            text-align: center;
            
        }

        .line4{
            display: grid;
            grid-template-columns: repeat(12,1fr);
            gap: 10px;
            margin: 5px;
            height: 30px;
        }

        .line4>div{
            background-color: black;
            color: white;
            text-align: center;
            padding: 5px;
            
        }
        .line5{
            display: grid;
            grid-template-columns: repeat(12,1fr);
            gap: 10px;
            height: 30px;
            margin: 5px;

        }

        .line5>div{
            background-color: black;
            color: white;
            padding: 5px;
            text-align: center;
        }

        .enter{
            grid-column: span 2;
        }
        .shift{grid-column: span 2;}

        .space{
            grid-column: span 4;
        }

        .delete{grid-column: span 2;}
    </style>
    
</head>
<body>
    <div id="container">
        <div class="line1">
            <div class="div1">~</div>
            <div class="div2">1</div>
            <div class="div3">2</div>
            <div class="div4">3</div>
            <div class="div5">4</div>
            <div class="div6">5</div>
            <div class="div7">6</div>
            <div class="div8">7</div>
            <div class="div9">8</div>
            <div class="div10">9</div>
            <div class="div11">0</div>
            <div class="delete">delete</div>
        </div>
        <div class="line2">
            <div class="div1">tab</div>
            <div class="div2">Q</div>
            <div class="div3">W</div>
            <div class="div4">E</div>
            <div class="div5">R</div>
            <div class="div6">T</div>
            <div class="div7">Y</div>
            <div class="div8">U</div>
            <div class="div9">I</div>
            <div class="div10">O</div>
            <div class="div11">P</div>
            <div class="div12">\</div>
        </div>
        <div class="line3">
            <div class="div1">caps</div>
            <div class="div2">A</div>
            <div class="div3">S</div>
            <div class="div4">D</div>
            <div class="div5">F</div>
            <div class="div6">G</div>
            <div class="div7">H</div>
            <div class="div8">J</div>
            <div class="div9">K</div>
            <div class="div10">L</div>
            <div class="enter">Enter</div>
        </div>
        <div class="line4">
            <div class="div1">Shift</div>
            <div class="div2">Z</div>
            <div class="div3">X</div>
            <div class="div4">C</div>
            <div class="div5">V</div>
            <div class="div6">B</div>
            <div class="div7">N</div>
            <div class="div8">M</div>
            <div class="div9"><</div>
            <div class="div10">></div>
            <div class="shift">Shift</div>
        </div>
        <div class="line5">
            <div class="div1">ctrl</div>
            <div class="div2">control</div>
            <div class="div3">options</div>
            <div class="div4">alt</div>
            <div class="space">Space</div>
            <div class="div6">alt</div>
            <div class="div7">option</div>
            <div class="div8"><-</div>
            <div class="div9">-></div>
        </div>
    </div>
</body>
</html>
